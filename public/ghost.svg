<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="ghost-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cyan chromatic offset (right) -->
  <g transform="translate(5,3)" opacity="0.75">
    <path d="M 55 90
             Q 55 50 100 48
             Q 145 50 145 90
             L 145 145
             Q 140 152 130 145
             Q 122 138 115 148
             Q 108 158 100 148
             Q 92 138 85 148
             Q 78 158 70 145
             Q 60 138 55 145
             Z"
          fill="none" stroke="#00F5FF" stroke-width="3.5"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Yellow chromatic offset (left) -->
  <g transform="translate(-3,-2)" opacity="0.55">
    <path d="M 55 90
             Q 55 50 100 48
             Q 145 50 145 90
             L 145 145
             Q 140 152 130 145
             Q 122 138 115 148
             Q 108 158 100 148
             Q 92 138 85 148
             Q 78 158 70 145
             Q 60 138 55 145
             Z"
          fill="none" stroke="#FFE600" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Main pink ghost body -->
  <g filter="url(#ghost-glow)">
    <path d="M 55 90
             Q 55 50 100 48
             Q 145 50 145 90
             L 145 145
             Q 140 152 130 145
             Q 122 138 115 148
             Q 108 158 100 148
             Q 92 138 85 148
             Q 78 158 70 145
             Q 60 138 55 145
             Z"
          fill="none" stroke="#FF1EAD" stroke-width="3.5"
          stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Both eyes as Xs -->
    <g stroke="#FF1EAD" stroke-width="3.5" stroke-linecap="round">
      <!-- left X -->
      <line x1="73" y1="80" x2="90" y2="97"/>
      <line x1="90" y1="80" x2="73" y2="97"/>
      <!-- right X -->
      <line x1="110" y1="80" x2="127" y2="97"/>
      <line x1="127" y1="80" x2="110" y2="97"/>
    </g>

    <!-- Jagged zigzag mouth -->
    <path d="M 80 122
             L 87 132
             L 94 122
             L 101 132
             L 108 122
             L 115 132
             L 122 122"
          fill="none" stroke="#FF1EAD" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Drips below the body -->
  <g fill="#FF1EAD">
    <ellipse cx="70" cy="170" rx="2" ry="3" opacity="0.85"/>
    <ellipse cx="100" cy="178" rx="2.5" ry="3.5" opacity="0.85"/>
    <ellipse cx="130" cy="172" rx="2" ry="2.5" opacity="0.85"/>
    <circle cx="85" cy="165" r="1" opacity="0.6"/>
    <circle cx="115" cy="167" r="1" opacity="0.6"/>
  </g>
</svg>
